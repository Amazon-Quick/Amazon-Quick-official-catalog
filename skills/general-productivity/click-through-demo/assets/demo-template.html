<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__DEMO_TITLE__</title>
<style>
  :root {
    --accent: #7c3aed;
    --accent-ink: #ffffff;
    --bg: #f6f5f9;
    --surface: #ffffff;
    --ink: #17151f;
    --ink-2: #57536a;
    --ink-3: #8e8aa0;
    --line: rgba(23, 21, 31, 0.10);
    --line-2: rgba(23, 21, 31, 0.06);
    --scrim: rgba(17, 15, 28, 0.48);
    --shadow: 0 12px 32px rgba(17, 15, 28, 0.18), 0 2px 6px rgba(17, 15, 28, 0.08);
    --radius: 12px;
    --radius-sm: 8px;
    --font: 'Amazon Ember', 'Inter', 'Helvetica Neue', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: 'SF Mono', Menlo, Consolas, monospace;
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121019; --surface: #1d1a27; --ink: #f2f0f7; --ink-2: #b9b4c9; --ink-3: #8a859b; --line: rgba(255,255,255,0.12); --line-2: rgba(255,255,255,0.06); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .app { max-width: 1440px; margin: 0 auto; padding: 16px 20px 24px; }
  .app:fullscreen { max-width: none; padding: 12px 16px; background: var(--bg); overflow: auto; }
  .bar { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-mark { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); flex: none; }
  h1 { font-size: 16px; font-weight: 650; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { font-size: 12px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .controls { display: flex; align-items: center; gap: 6px; flex: none; }
  .count { font-family: var(--mono); font-size: 12px; color: var(--ink-2); margin-right: 4px; }
  .icon-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 13px; transition: border-color 0.15s, background 0.15s; }
  .icon-btn:hover { border-color: var(--accent); }
  .icon-btn svg { width: 16px; height: 16px; }
  .menu { position: absolute; right: 0; top: 40px; z-index: 30; width: min(360px, 92vw); max-height: 70vh; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 8px; }
  .menu h3 { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin: 10px 10px 4px; }
  .menu button { display: flex; width: 100%; gap: 10px; align-items: baseline; text-align: left; border: 0; background: none; border-radius: var(--radius-sm); padding: 8px 10px; cursor: pointer; font-size: 14px; }
  .menu button:hover { background: var(--line-2); }
  .menu button[aria-current="step"] { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--ink); font-weight: 600; }
  .menu .num { font-family: var(--mono); font-size: 12px; color: var(--ink-3); width: 22px; flex: none; }
  .progress { display: flex; gap: 4px; margin-bottom: 12px; }
  .seg { flex: 1; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .seg > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.35s var(--ease); }
  .frame { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .window-bar { display: flex; align-items: center; gap: 7px; padding: 9px 12px; border-bottom: 1px solid var(--line-2); }
  .window-bar .d { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; }
  .url { flex: 1; margin-left: 8px; font-family: var(--mono); font-size: 12px; color: var(--ink-2); background: var(--bg); border-radius: 6px; padding: 5px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stage { position: relative; overflow: hidden; line-height: 0; background: var(--bg); }
  .canvas { position: relative; transform-origin: 50% 50%; transition: transform 0.5s var(--ease); }
  .canvas img { display: block; width: 100%; height: auto; transition: opacity 0.2s ease; user-select: none; -webkit-user-drag: none; }
  .canvas.swap img { opacity: 0.35; }
  .spot { position: absolute; padding: 0; border: 2px solid var(--accent); border-radius: 8px; background: transparent; cursor: pointer; box-shadow: 0 0 0 9999px var(--scrim); transition: left 0.35s var(--ease), top 0.35s var(--ease), width 0.35s var(--ease), height 0.35s var(--ease); }
  .spot.focus { cursor: default; }
  .spot:not(.focus)::after { content: ""; position: absolute; inset: -7px; border: 2px solid var(--accent); border-radius: 11px; opacity: 0; pointer-events: none; }
  .spot.nudge { animation: none; }
  .tip { position: absolute; z-index: 10; width: 360px; max-width: calc(100% - 20px); line-height: 1.5; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px 12px; font-size: 14px; transition: opacity 0.2s ease; }
  .tip.wide { width: 440px; }
  .tip-body { max-height: min(70vh, 560px); overflow: auto; overscroll-behavior: contain; }
  .tip.hidden { opacity: 0; pointer-events: none; }
  .tip .arrow { position: absolute; width: 12px; height: 12px; background: var(--surface); border: 1px solid var(--line); transform: rotate(45deg); }
  .tip[data-side="below"] .arrow { top: -7px; border-right: 0; border-bottom: 0; }
  .tip[data-side="above"] .arrow { bottom: -7px; border-left: 0; border-top: 0; }
  .tip[data-side="right"] .arrow { left: -7px; border-top: 0; border-right: 0; }
  .tip[data-side="left"] .arrow { right: -7px; border-bottom: 0; border-left: 0; }
  .tip[data-side="none"] .arrow, .tip.docked .arrow { display: none; }
  .tip.docked { position: relative; left: auto !important; top: auto !important; width: auto; max-width: none; border: 0; border-top: 1px solid var(--line); border-radius: 0; box-shadow: none; }
  .eyebrow { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-3); margin-bottom: 4px; }
  .eyebrow .chap { color: var(--accent); font-weight: 600; }
  .tip h2 { font-size: 16px; line-height: 1.35; margin: 0 0 6px; }
  .tip p { margin: 0 0 10px; color: var(--ink-2); }
  .tip .action { display: flex; align-items: center; gap: 8px; color: var(--ink); font-weight: 600; background: color-mix(in srgb, var(--accent) 9%, transparent); border-radius: var(--radius-sm); padding: 7px 10px; }
  .tip .action svg { width: 16px; height: 16px; color: var(--accent); flex: none; }
  .media { margin: 4px 0 12px; display: grid; gap: 8px; }
  .media figure { margin: 0; }
  .media img, .media video { display: block; width: 100%; height: auto; border-radius: var(--radius-sm); border: 1px solid var(--line-2); }
  .media figcaption { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
  .nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
  .hint { font-size: 11px; color: var(--ink-3); }
  .btn { height: 34px; padding: 0 14px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 13px; font-weight: 550; transition: border-color 0.15s, filter 0.15s, transform 0.1s; }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  a.btn { display: inline-flex; align-items: center; text-decoration: none; }
  .cards { position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 20px; line-height: 1.5; background: var(--scrim); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .cards[hidden] { display: none; }
  .card { width: min(520px, 100%); max-height: 100%; overflow: auto; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 26px 28px 22px; }
  .card .kicker { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
  .card h2 { font-size: 22px; line-height: 1.25; margin: 0 0 10px; }
  .card p { color: var(--ink-2); margin: 0 0 16px; font-size: 15px; }
  .card ol { margin: 0 0 18px; padding-left: 20px; color: var(--ink-2); font-size: 14px; }
  .card .row { display: flex; gap: 8px; flex-wrap: wrap; }
  @media (prefers-reduced-motion: no-preference) {
    .spot:not(.focus)::after { animation: ring 1.8s var(--ease) infinite; }
    .spot.nudge { animation: nudge 0.38s; }
    .tip.enter, .card.enter { animation: rise 0.28s var(--ease); }
  }
  @media (prefers-reduced-motion: reduce) {
    .canvas, .spot, .seg > i, .canvas img { transition: none; }
  }
  @keyframes ring { 0% { opacity: 0.85; transform: scale(1); } 100% { opacity: 0; transform: scale(1.18); } }
  @keyframes nudge { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (max-width: 640px) { .app { padding: 10px; } .hint { display: none; } .count { display: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <div class="brand"><span class="brand-mark"></span><h1 id="demo-title"></h1><span class="pill" id="chapter-pill" hidden></span></div>
    <div class="controls">
      <span class="count" id="count"></span>
      <button class="icon-btn" id="menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Steps
      </button>
      <button class="icon-btn" id="fs-btn" type="button" aria-label="Full screen" title="Full screen (F)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
    </div>
    <nav class="menu" id="menu" hidden aria-label="All steps"></nav>
  </header>
  <div class="progress" id="progress" aria-hidden="true"></div>
  <div class="frame">
    <div class="window-bar"><span class="d"></span><span class="d"></span><span class="d"></span><span class="url" id="url"></span></div>
    <div class="stage" id="stage">
      <div class="canvas" id="canvas">
        <img id="shot" alt="" draggable="false">
        <button class="spot" id="spot" type="button"></button>
      </div>
      <div class="tip" id="tip" role="dialog" aria-live="polite" aria-labelledby="tip-title"></div>
      <div class="cards" id="cards" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
    </div>
  </div>
</div>
<script id="demo-data" type="application/json">__DEMO_DATA__</script>
<script>
(() => {
  const DEMO = JSON.parse(document.getElementById('demo-data').textContent);
  const STEPS = DEMO.steps;
  const CHAPTERS = new Map(DEMO.chapters.map((c) => [c.position, c.title]));
  const GAP = 14, MARGIN = 10, DOCK_BELOW = 640, SECONDS_PER_STEP = 10;
  const ARROW_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 14a8 8 0 0 1-8 8"/><path d="M18 11v-1a2 2 0 0 0-4 0"/><path d="M14 10V9a2 2 0 0 0-4 0v1"/><path d="M10 9.5V4a2 2 0 0 0-4 0v10"/><path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>';
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined && text !== null) n.textContent = text; return n; };
  let index = 0;
  let mode = DEMO.intro ? 'intro' : 'step';

  document.documentElement.style.setProperty('--accent', DEMO.accent);
  $('demo-title').textContent = DEMO.title;
  document.title = DEMO.title;

  const chapterOf = (i) => (STEPS[i].chapter != null ? STEPS[i].chapter : null);
  const isLast = () => index === STEPS.length - 1;

  function button(label, cls, onClick) {
    const b = el('button', cls, label); b.type = 'button';
    b.addEventListener('click', (e) => { e.stopPropagation(); onClick(); });
    return b;
  }

  function buildProgress() {
    const bar = $('progress'); bar.replaceChildren();
    const groups = [];
    STEPS.forEach((s, i) => {
      const key = chapterOf(i) != null ? 'c' + chapterOf(i) : 's' + i;
      const last = groups[groups.length - 1];
      if (DEMO.chapters.length && last && last.key === key) last.count += 1; else groups.push({ key, start: i, count: 1 });
    });
    groups.forEach((g) => { const seg = el('div', 'seg'); seg.style.flex = String(g.count); seg.dataset.start = g.start; seg.dataset.count = g.count; seg.append(el('i')); bar.append(seg); });
  }

  function paintProgress() {
    const done = mode === 'intro' ? 0 : mode === 'outro' ? STEPS.length : index + 1;
    document.querySelectorAll('.seg').forEach((seg) => {
      const start = Number(seg.dataset.start), count = Number(seg.dataset.count);
      const filled = Math.max(0, Math.min(count, done - start));
      seg.firstChild.style.width = (filled / count * 100) + '%';
    });
  }

  function buildMenu() {
    const menu = $('menu'); menu.replaceChildren();
    let current = undefined;
    STEPS.forEach((s, i) => {
      const ch = chapterOf(i);
      if (DEMO.chapters.length && ch !== current) { current = ch; menu.append(el('h3', '', ch != null ? CHAPTERS.get(ch) : 'More')); }
      const item = button('', '', () => { closeMenu(); go(i); });
      item.append(el('span', 'num', String(i + 1)), el('span', '', s.title));
      item.dataset.index = i;
      menu.append(item);
    });
  }

  function openMenu() { $('menu').hidden = false; $('menu-btn').setAttribute('aria-expanded', 'true'); const cur = $('menu').querySelector('[aria-current]'); (cur || $('menu').querySelector('button')).focus(); }
  function closeMenu() { $('menu').hidden = true; $('menu-btn').setAttribute('aria-expanded', 'false'); }

  function stageRectOfHotspot(s) {
    const stage = $('stage'), W = stage.clientWidth, H = $('canvas').clientHeight;
    const hs = s.hotspot, z = mode === 'step' ? (hs.zoom || 1) : 1;
    const cx = (hs.x + hs.w / 2) / 100 * W, cy = (hs.y + hs.h / 2) / 100 * H;
    const left = cx + (hs.x / 100 * W - cx) * z, top = cy + (hs.y / 100 * H - cy) * z;
    const width = hs.w / 100 * W * z, height = hs.h / 100 * H * z;
    return { left, top, width, height, right: left + width, bottom: top + height, cx, cy, W, H };
  }

  function placeTip() {
    const tip = $('tip'), s = STEPS[index];
    if (!tip.querySelector('.arrow') || mode !== 'step') return;
    const W = $('stage').clientWidth;
    tip.classList.toggle('docked', W < DOCK_BELOW);
    if (W < DOCK_BELOW) { tip.dataset.side = 'none'; return; }
    const tw = tip.offsetWidth, th = tip.offsetHeight, H = $('canvas').clientHeight;
    const arrow = tip.querySelector('.arrow');
    if (!s.hotspot) { tip.dataset.side = 'none'; tip.style.left = Math.max(MARGIN, W - tw - MARGIN * 2) + 'px'; tip.style.top = Math.max(MARGIN, H - th - MARGIN * 2) + 'px'; return; }
    const r = stageRectOfHotspot(s);
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const options = [
      { side: 'below', fits: r.bottom + GAP + th <= H - MARGIN, left: clamp(r.cx - tw / 2, MARGIN, W - tw - MARGIN), top: r.bottom + GAP },
      { side: 'above', fits: r.top - GAP - th >= MARGIN, left: clamp(r.cx - tw / 2, MARGIN, W - tw - MARGIN), top: r.top - GAP - th },
      { side: 'right', fits: r.right + GAP + tw <= W - MARGIN, left: r.right + GAP, top: clamp(r.cy - th / 2, MARGIN, H - th - MARGIN) },
      { side: 'left', fits: r.left - GAP - tw >= MARGIN, left: r.left - GAP - tw, top: clamp(r.cy - th / 2, MARGIN, H - th - MARGIN) },
    ];
    const pick = options.find((o) => o.fits) || { side: 'none', left: W - tw - MARGIN, top: clamp(H - th - MARGIN, MARGIN, H) };
    tip.dataset.side = pick.side; tip.style.left = pick.left + 'px'; tip.style.top = pick.top + 'px';
    if (pick.side === 'below' || pick.side === 'above') { arrow.style.left = clamp(r.cx - pick.left - 6, 16, tw - 28) + 'px'; arrow.style.top = ''; }
    if (pick.side === 'left' || pick.side === 'right') { arrow.style.top = clamp(r.cy - pick.top - 6, 16, th - 28) + 'px'; arrow.style.left = ''; }
  }

  function renderMedia(items) {
    const box = el('div', 'media');
    items.forEach((m) => {
      if (m.kind === 'image') { const f = el('figure'); const img = el('img'); img.src = m.src; img.alt = m.caption || ''; img.loading = 'lazy'; f.append(img); if (m.caption) f.append(el('figcaption', '', m.caption)); box.append(f); }
      if (m.kind === 'video') { const f = el('figure'); const v = el('video'); v.src = m.src; v.controls = true; v.preload = 'metadata'; v.playsInline = true; f.append(v); if (m.caption) f.append(el('figcaption', '', m.caption)); box.append(f); }
    });
    return box;
  }

  function renderTip() {
    const s = STEPS[index], tip = $('tip');
    tip.classList.remove('hidden', 'enter'); void tip.offsetWidth; tip.classList.add('enter');
    tip.classList.toggle('wide', s.media.length > 0);
    const head = el('div', 'eyebrow');
    head.append(el('span', '', 'Step ' + (index + 1) + ' of ' + STEPS.length), el('span', 'chap', chapterOf(index) != null ? CHAPTERS.get(chapterOf(index)) : ''));
    const title = el('h2', '', s.title); title.id = 'tip-title';
    const body = el('div', 'tip-body');
    tip.replaceChildren(el('span', 'arrow'), body);
    body.append(head, title, el('p', '', s.caption));
    if (s.media.length) body.append(renderMedia(s.media));
    if (s.action && !isLast()) { const a = el('p', 'action'); a.innerHTML = ARROW_ICON; a.append(el('span', '', s.action)); body.append(a); }
    const nav = el('div', 'nav');
    const backBtn = button('Back', 'btn', goBack); backBtn.disabled = index === 0 && !DEMO.intro;
    const nextLabel = isLast() ? (DEMO.outro ? 'Finish' : 'Restart') : 'Next';
    nav.append(backBtn, el('span', 'hint', isLast() ? '' : 'Click the highlight or press \u2192'), button(nextLabel, 'btn primary', advance));
    body.append(nav);
    placeTip();
  }

  function renderStage() {
    const s = STEPS[index], img = $('shot'), canvas = $('canvas'), spot = $('spot');
    $('url').textContent = s.url;
    canvas.classList.add('swap');
    const ready = () => { canvas.classList.remove('swap'); applyZoom(); if (mode === 'step') renderTip(); };
    if (img.getAttribute('src') !== s.image) { img.onload = ready; img.src = s.image; img.alt = s.title; if (img.complete) { img.onload = null; ready(); } } else { ready(); }
    if (s.hotspot && mode === 'step') {
      spot.hidden = false;
      Object.assign(spot.style, { left: s.hotspot.x + '%', top: s.hotspot.y + '%', width: s.hotspot.w + '%', height: s.hotspot.h + '%' });
      spot.classList.toggle('focus', isLast());
      spot.setAttribute('aria-label', isLast() ? s.title : (s.action || 'Next step'));
      spot.tabIndex = isLast() ? -1 : 0;
    } else { spot.hidden = true; }
  }

  function applyZoom() {
    const s = STEPS[index], canvas = $('canvas');
    if (mode === 'step' && s.hotspot && s.hotspot.zoom > 1) {
      canvas.style.transformOrigin = (s.hotspot.x + s.hotspot.w / 2) + '% ' + (s.hotspot.y + s.hotspot.h / 2) + '%';
      canvas.style.transform = 'scale(' + s.hotspot.zoom + ')';
    } else { canvas.style.transform = 'none'; }
  }

  function header() {
    const ch = mode === 'step' ? chapterOf(index) : null, pill = $('chapter-pill');
    pill.hidden = ch == null; pill.textContent = ch != null ? CHAPTERS.get(ch) : '';
    $('count').textContent = mode === 'intro' ? 'Intro' : mode === 'outro' ? 'Done' : (index + 1) + ' / ' + STEPS.length;
    document.querySelectorAll('#menu button[data-index]').forEach((b) => { if (Number(b.dataset.index) === index && mode === 'step') b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); });
    paintProgress();
    try { history.replaceState(null, '', mode === 'step' ? '#step-' + (index + 1) : '#' + mode); } catch (e) { /* sandboxed viewers block this */ }
  }

  function showCard(build) {
    $('tip').classList.add('hidden');
    $('spot').hidden = true; $('canvas').style.transform = 'none';
    const card = $('card'); card.classList.remove('enter'); void card.offsetWidth; card.classList.add('enter');
    card.replaceChildren(); build(card);
    $('cards').hidden = false;
    const primary = card.querySelector('.btn.primary'); if (primary) primary.focus();
  }

  function showIntro() {
    mode = 'intro'; index = 0; renderStage(); header();
    showCard((card) => {
      const minutes = Math.max(1, Math.round(STEPS.length * SECONDS_PER_STEP / 60));
      card.append(el('div', 'kicker', 'Interactive demo \u00b7 ' + STEPS.length + ' steps \u00b7 about ' + minutes + ' min'), el('h2', '', DEMO.intro.title));
      if (DEMO.intro.body) card.append(el('p', '', DEMO.intro.body));
      if (DEMO.chapters.length > 1) { const ol = el('ol'); DEMO.chapters.forEach((c) => ol.append(el('li', '', c.title))); card.append(ol); }
      const row = el('div', 'row'); row.append(button('Start tour', 'btn primary', () => go(0))); card.append(row);
    });
  }

  function showOutro() {
    mode = 'outro'; renderStage(); header();
    showCard((card) => {
      card.append(el('div', 'kicker', 'Tour complete'), el('h2', '', DEMO.outro.title));
      if (DEMO.outro.body) card.append(el('p', '', DEMO.outro.body));
      const row = el('div', 'row');
      if (DEMO.outro.cta_url) { const a = el('a', 'btn primary', DEMO.outro.cta_label || 'Learn more'); a.href = DEMO.outro.cta_url; a.target = '_blank'; a.rel = 'noopener noreferrer'; row.append(a); }
      row.append(button('Replay tour', DEMO.outro.cta_url ? 'btn' : 'btn primary', () => (DEMO.intro ? showIntro() : go(0))));
      row.append(button('Back', 'btn', () => go(STEPS.length - 1)));
      card.append(row);
    });
  }

  function go(i) {
    if (i < 0) return;
    mode = 'step'; index = Math.min(STEPS.length - 1, i);
    $('cards').hidden = true;
    renderStage(); header();
  }

  function advance() {
    if (mode === 'intro') return go(0);
    if (mode === 'outro') return DEMO.intro ? showIntro() : go(0);
    if (!isLast()) return go(index + 1);
    if (DEMO.outro) return showOutro();
    return DEMO.intro ? showIntro() : go(0);
  }

  function goBack() {
    if (mode === 'outro') return go(STEPS.length - 1);
    if (mode === 'step' && index === 0 && DEMO.intro) return showIntro();
    if (mode === 'step') go(index - 1);
  }

  $('spot').addEventListener('click', (e) => { e.stopPropagation(); if (mode === 'step' && !isLast()) advance(); });
  $('shot').addEventListener('click', () => { if (mode !== 'step') return; const spot = $('spot'); spot.classList.remove('nudge'); void spot.offsetWidth; spot.classList.add('nudge'); });
  $('menu-btn').addEventListener('click', (e) => { e.stopPropagation(); if ($('menu').hidden) openMenu(); else closeMenu(); });
  document.addEventListener('click', (e) => { if (!$('menu').hidden && !$('menu').contains(e.target)) closeMenu(); });
  $('fs-btn').addEventListener('click', toggleFullscreen);
  function toggleFullscreen() { const app = $('app'); if (document.fullscreenElement) document.exitFullscreen(); else if (app.requestFullscreen) app.requestFullscreen().catch(() => {}); }
  document.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'Escape') { if (!$('menu').hidden) { closeMenu(); $('menu-btn').focus(); } return; }
    if (!$('menu').hidden) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); advance(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); goBack(); }
    else if (e.key === 'Home') { e.preventDefault(); DEMO.intro ? showIntro() : go(0); }
    else if (e.key === 'End') { e.preventDefault(); go(STEPS.length - 1); }
    else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  });
  window.addEventListener('resize', () => { if (mode === 'step') placeTip(); });
  if (window.ResizeObserver) new ResizeObserver(() => { if (mode === 'step') placeTip(); }).observe($('stage'));

  buildProgress(); buildMenu();
  STEPS.forEach((s) => { const pre = new Image(); pre.src = s.image; });
  const fromHash = /^#step-(\d+)$/.exec(location.hash);
  if (fromHash && Number(fromHash[1]) >= 1 && Number(fromHash[1]) <= STEPS.length) go(Number(fromHash[1]) - 1);
  else if (DEMO.intro) showIntro();
  else go(0);
})();
</script>
</body>
</html>
